name: system-pro

# TASK-01: infrastructure only (PostgreSQL 17). No app services, no Redis.
# Path B (Docker):  docker compose -f infra/docker-compose.yml up postgres --wait
# Path A (local):   run PostgreSQL 17 directly on Windows; no containers needed.
services:
  postgres:
    image: postgres:17-alpine
    # Supply-chain note: production deployments MUST pin this image by digest
    # (e.g. postgres:17-alpine@sha256:<verified>) and verify it in CI.
    # The tag is used here for TASK-01 dev portability only.
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-systempro_dev}
      POSTGRES_USER: ${POSTGRES_USER:-systempro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (dev-only value, never reuse in production)}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: systempro_pgdata
